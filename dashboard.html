<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forzes Stream — панель заявок</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--line:rgba(255,255,255,.09);--dim:#9aa3c7;--err:#f87171}
body{min-height:100vh;font-family:'Rubik',system-ui,sans-serif;color:#eef1ff;background:#0b0e1a;padding:26px 16px 60px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 460px at 20% 0%,rgba(139,92,246,.22),transparent 60%),radial-gradient(800px 520px at 90% 10%,rgba(59,130,246,.18),transparent 60%),#0b0e1a}
.wrap{max-width:780px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
h1{font-size:21px;font-weight:900}
h1 span{color:#a78bfa}
.tools{display:flex;gap:12px;align-items:center}
.stat{font-size:13px;color:#c4b5fd;font-weight:700}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#dbe1ff;padding:9px 14px;font-size:13px}
button:hover{background:rgba(255,255,255,.12)}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
#err{margin:0 0 14px;padding:11px 14px;border-radius:12px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:#fca5a5;font-size:13px;line-height:1.55}
.item{display:flex;gap:14px;background:rgba(18,22,40,.85);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}
.item img{width:168px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;flex:none}
.info{min-width:0;flex:1;display:flex;flex-direction:column}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nick{font-weight:700;font-size:15px}
.time{font-size:11.5px;color:var(--dim)}
.desc{font-size:13px;color:#c7cdec;line-height:1.5;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.acts{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{text-decoration:none;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);padding:8px 13px;border-radius:10px;border:none;cursor:pointer}
.linkbtn:hover{opacity:.9}
.del{font-size:12.5px;color:#fca5a5;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07);padding:8px 13px;border-radius:10px}
.del:hover{background:rgba(248,113,113,.16)}
.empty{padding:40px 10px;text-align:center;color:var(--dim);font-size:14px;border:1px dashed var(--line);border-radius:16px}
.foot{margin-top:26px;font-size:12.5px;color:#6d76a3;text-align:center}
.foot a{color:#93c5fd;text-decoration:none}
.foot a:hover{text-decoration:underline}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header>
    <h1>📋 Заявки на обзор <span>Forzes Stream</span></h1>
    <div class="tools">
      <span class="stat">Всего: <span id="count">0</span></span>
      <button id="refresh" type="button">⟳ Обновить</button>
    </div>
  </header>
  <p class="sub">Новые заявки появляются здесь автоматически. Ссылка «Открыть» ведёт на видео.</p>
  <div id="err" class="hidden"></div>
  <div id="list"></div>
  <div class="foot"><a href="index.html">← на страницу отправки</a> · <a href="settings.html">⚙️ настройки уведомлений</a></div>
</div>
<script src="protect.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
