<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Forzes Stream — уведомления для OBS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{background:transparent;margin:0;padding:0;font-family:'Rubik',system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;top:14px;right:14px;width:280px;display:flex;flex-direction:column;gap:8px}
.card{position:relative;background:rgba(13,16,30,.94);border:1px solid rgba(139,92,246,.5);border-radius:13px;padding:10px 11px;box-shadow:0 8px 28px rgba(0,0,0,.55);color:#eef1ff;animation:in .45s cubic-bezier(.18,.9,.28,1.15) both}
.close{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#9aa3c7;font-size:11px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
.close:hover{background:rgba(248,113,113,.25);border-color:rgba(248,113,113,.45);color:#fff}
@keyframes in{from{transform:translateX(115%) scale(.94);opacity:0}to{transform:none;opacity:1}}
.card.out{animation:out .4s ease forwards}
@keyframes out{to{transform:translateX(115%);opacity:0}}
.head{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#b7a5f5;margin-bottom:7px;padding-right:24px}
.dot{width:7px;height:7px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 8px #8b5cf6;animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.4}}
.thumb{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;display:block;float:left;margin-right:10px}
.nick{font-weight:700;font-size:12.5px;margin-top:0;line-height:1.3}
.nick .who{color:#a78bfa}
.msg{font-size:11px;color:#b9c0e2;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;clear:none}
.row{margin-top:9px;clear:both}
.btn{display:block;text-align:center;padding:7px 10px;border-radius:9px;font-size:11px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);box-shadow:0 4px 12px rgba(124,58,237,.35)}
.warn{font-size:11px;color:#fcd34d;line-height:1.5}
</style>
</head>
<body>
<div id="wrap"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="widget.js"></script>
</body>
</html>
