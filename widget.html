<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Forzes Stream — уведомления для OBS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{background:transparent;margin:0;padding:0;font-family:'Rubik',system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;top:18px;right:18px;width:400px;display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:rgba(13,16,30,.94);border:1px solid rgba(139,92,246,.55);border-radius:18px;padding:14px;box-shadow:0 12px 44px rgba(0,0,0,.65);color:#eef1ff;animation:in .55s cubic-bezier(.18,.9,.28,1.15) both}
.close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#c7cdec;font-size:14px;line-height:1;cursor:pointer;font-family:inherit}
.close:hover{background:rgba(248,113,113,.28);border-color:rgba(248,113,113,.5);color:#fff}
@keyframes in{from{transform:translateX(115%) scale(.92);opacity:0}to{transform:none;opacity:1}}
.card.out{animation:out .45s ease forwards}
@keyframes out{to{transform:translateX(115%);opacity:0}}
.head{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#c4b5fd;margin-bottom:11px}
.dot{width:9px;height:9px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 12px #8b5cf6;animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#000;display:block}
.nick{font-weight:700;font-size:15.5px;margin-top:11px}
.nick .who{color:#a78bfa}
.msg{font-size:13px;color:#c7cdec;line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:12px}
.btn{display:block;text-align:center;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);box-shadow:0 6px 18px rgba(124,58,237,.4)}
.warn{font-size:12.5px;color:#fcd34d;line-height:1.55}
</style>
</head>
<body>
<div id="wrap"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="widget.js"></script>
</body>
</html>
